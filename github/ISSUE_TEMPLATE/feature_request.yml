name: Feature request
description: Suggest something Veer Studio should do.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you need done that Studio can't do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
      description: The behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: What you do instead today, if anything.
