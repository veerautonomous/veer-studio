name: Bug report
description: Something in Veer Studio isn't working the way it should.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        GitHub unreachable? File via [veerautonomous.com/contact](https://veerautonomous.com/contact/).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: input
    id: studio-version
    attributes:
      label: Studio version
      placeholder: "e.g. 0.3.1"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "e.g. Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste log output here. Redact anything private.
      render: shell
